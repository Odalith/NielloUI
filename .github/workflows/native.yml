# Prebuilt native backends (TODO #11). Builds the Skia+Dawn base per
# platform, compiles nui.cpp against it, merges the fat archive, and
# zips it in the third_party/native layout (see tools/build-native.md).
#
# Two-tier by design (his call 2026-10-22): the Skia+Dawn base is rebuilt
# only when the pinned Skia revision changes (or the gn args change —
# bump the -v1 key suffix then); ordinary releases only compile
# nui.cpp + merge + zip — minutes, not an hour of 10x-billed macos-15 time.
#
# Pin file: tools/skia-rev.txt holds one line — the Skia revision tested
# on his machine (the same rev build-native.sh records into BUILD-INFO.txt).
# Both tiers read it; the caches key off it.
#
# Scope note (2026-11-01): F7(a) — gating the CMake find_package calls
# by platform — is implemented in native/CMakeLists.txt, so all three
# pack jobs configure; the macOS/Windows link sets are the documented
# ones for Dawn + Skia and unproven until the first run. Windows CRT
# alignment stays a manual check (recipe §6) even after this workflow
# is green.
#
# GN args are the build-native.md §2 blocks (F1–F8 ruled 2026-11-01,
# F9 freeze): bundled sourcing (F1b) + DNG/PIEX trim (F4) + the
# HarfBuzz correction from the 2026-11-01 consume test
# (skia_use_system_harfbuzz=false) + skia_use_system_icu=false:
# is_official_build defaults system ICU on, which expects system
# headers no bare runner has; bundled ICU matches F1(b).
# Merge commands from §6; zip layout from §7.

name: native-release

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'native-v*'

jobs:
  # ---- tier 1: build (or restore) the Skia+Dawn base per platform ----
  base:
    name: base (${{ matrix.plat }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - plat: linux-x64
            runner: ubuntu-24.04
            out: niello-linux-x64
            gn_args: >
              is_official_build=true is_debug=false
              skia_enable_graphite=true skia_enable_ganesh=false
              skia_use_vulkan=true skia_use_dawn=true dawn_enable_vulkan=true
              skia_use_webgpu=true skia_use_vma=true
              skia_use_partition_alloc=false
              skia_use_dng_sdk=false skia_use_piex=false
              skia_use_system_expat=false skia_use_system_freetype2=false skia_use_system_libjpeg_turbo=false skia_use_system_libpng=false skia_use_system_libwebp=false skia_use_system_zlib=false skia_use_system_harfbuzz=false skia_use_system_icu=false
              cc="clang" cxx="clang++"
          - plat: macos-arm64
            runner: macos-15
            out: niello-macos-arm64
            gn_args: >
              is_official_build=true is_debug=false
              skia_enable_graphite=true skia_enable_ganesh=false
              skia_use_dawn=true dawn_enable_metal=true
              dawn_enable_vulkan=false dawn_enable_d3d12=false
              skia_use_webgpu=true skia_use_vma=true
              skia_use_partition_alloc=false
              skia_use_dng_sdk=false skia_use_piex=false
              skia_use_system_expat=false skia_use_system_libjpeg_turbo=false skia_use_system_libpng=false skia_use_system_libwebp=false skia_use_system_zlib=false skia_use_system_harfbuzz=false skia_use_system_icu=false
              target_cpu="arm64"
          - plat: windows-x64
            runner: windows-2022
            out: niello-windows-x64
            gn_args: >
              is_official_build=true is_debug=false
              skia_enable_graphite=true skia_enable_ganesh=false
              skia_use_dawn=true dawn_enable_d3d12=true
              dawn_enable_vulkan=false dawn_enable_metal=false
              skia_use_webgpu=true skia_use_vma=true
              skia_use_partition_alloc=false
              skia_use_dng_sdk=false skia_use_piex=false
              skia_use_system_expat=false skia_use_system_freetype2=false skia_use_system_libjpeg_turbo=false skia_use_system_libpng=false skia_use_system_libwebp=false skia_use_system_zlib=false skia_use_system_harfbuzz=false skia_use_system_icu=false
              target_os="win" target_cpu="x64"
    steps:
      - uses: actions/checkout@v4

      - name: read pinned skia rev
        id: rev
        shell: bash
        run: echo "rev=$(cat tools/skia-rev.txt)" >> "$GITHUB_OUTPUT"

      - name: restore skia checkout cache
        id: src-cache
        uses: actions/cache@v4
        with:
          # Shared across platforms: exclude the build outputs, which are
          # per-platform (cached separately, keyed by platform).
          path: |
            skia
            !skia/out
          key: skia-src-${{ steps.rev.outputs.rev }}

      - name: sync skia checkout
        if: steps.src-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          # depot_tools for ninja + the bundled clang-cl on Windows
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git depot_tools
          export PATH="$PWD/depot_tools:$PATH"
          git clone https://skia.googlesource.com/skia.git skia
          git -C skia checkout "${{ steps.rev.outputs.rev }}"
          # His proven local flow, NOT gclient: git-sync-deps reads DEPS,
          # checks out the externals shallow, and runs bin/fetch-gn, so
          # bin/gn exists for the build step. The gclient path died twice
          # (missing .gclient, then missing bin/gn: DEPS has no hooks).
          # SKIP_EMSDK: desktop builds never use Emscripten; the var is
          # git-sync-deps' own opt-out for its emsdk activation step.
          (cd skia && GIT_SYNC_DEPS_SKIP_EMSDK=1 python3 tools/git-sync-deps)
          # Fail loudly if the externals did not land.
          for d in dawn harfbuzz icu; do
            test -d "skia/third_party/externals/$d" || { echo "missing externals/$d after git-sync-deps" >&2; exit 1; }
          done
          # ninja is downloaded, not checked in (same as bin/gn):
          # depot_tools' `ninja` wrapper needs a bootstrapped checkout
          # ("python3_bin_reldir.txt not found" on a fresh clone), so
          # fetch the DEPS-pinned ninja. fetch-ninja lands it at
          # skia/third_party/ninja/ninja (ninja.exe on Windows) — NOT
          # skia/bin — and the build step calls that path.
          python3 skia/bin/fetch-ninja
          # NOTE: full sync is several GB; this runs only when the pin changes.

      - name: fetch platform build tools
        shell: bash
        run: |
          # The src cache is shared across platforms, but bin/gn and
          # third_party/ninja/ninja are PLATFORM binaries, and
          # fetch-ninja trusts bin/ninja.version: a foreign save looks
          # "up to date" to it, so re-running the fetchers alone would
          # keep the wrong binaries. Delete the stamped tools so both
          # fetchers unconditionally install this runner's binaries.
          # Runs on every job, hit or miss: git-sync-deps covers the
          # miss path, this covers the cache-hit path.
          rm -f skia/bin/gn skia/bin/gn.exe skia/third_party/ninja/ninja skia/third_party/ninja/ninja.exe skia/bin/ninja.version
          python3 skia/bin/fetch-gn
          python3 skia/bin/fetch-ninja

      - name: restore base build cache
        id: base-cache
        uses: actions/cache@v4
        with:
          path: skia/out/${{ matrix.out }}
          # Bump the -v1 suffix when gn_args change: the key pins the Skia rev only.
          key: skia-base-${{ matrix.plat }}-${{ steps.rev.outputs.rev }}-v1

      - name: install linux base deps
        if: matrix.plat == 'linux-x64' && steps.base-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          # Dawn's CMake requires X11 headers (find_package(X11 REQUIRED)
          # in src/dawn/native/CMakeLists.txt), Dawn's X11Functions also
          # needs X11/Xlib-xcb.h, and Skia's FontConfig port needs
          # fontconfig headers; the ubuntu runner has none of them.
          sudo apt-get update -qq
          sudo apt-get install -y -qq libx11-dev libx11-xcb-dev libfontconfig1-dev

      - name: build skia+dawn base
        if: steps.base-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          export PATH="$PWD/depot_tools:$PATH"
          cd skia
          # Dawn's CMake sub-build finds its ninja via `which ninja`: the
          # depot_tools wrapper on PATH is unbootstrapped on a fresh
          # clone ("python3_bin_reldir.txt not found"), so put the
          # DEPS-pinned real ninja first. depot_tools stays on PATH
          # behind it for the toolchain lookups.
          export PATH="$PWD/third_party/ninja:$PATH"
          bin/gn gen out/${{ matrix.out }} --args='${{ matrix.gn_args }}'
          # `ninja skia` never builds SkShaper: it lives under the
          # `modules` aggregate as its own archive (recipe §3).
          third_party/ninja/ninja -C out/${{ matrix.out }} skia modules/skshaper
          # Windows archives are .lib, not .a (recipe §3).
          if [ "${{ matrix.plat }}" = "windows-x64" ]; then
            test -f "out/${{ matrix.out }}/skshaper.lib" || { echo "skshaper.lib not built (recipe §3)" >&2; exit 1; }
          else
            test -f "out/${{ matrix.out }}/libskshaper.a" || { echo "libskshaper.a not built (recipe §3)" >&2; exit 1; }
          fi

  # ---- tier 2: compile nui.cpp against the base, merge, zip ----
  pack:
    name: pack (${{ matrix.plat }})
    needs: base
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - plat: linux-x64
            runner: ubuntu-24.04
            out: niello-linux-x64
            lib: lib/libniello_native.a
          - plat: macos-arm64
            runner: macos-15
            out: niello-macos-arm64
            lib: lib/libniello_native.a
          - plat: windows-x64
            runner: windows-2022
            out: niello-windows-x64
            lib: lib/niello_native.lib
    steps:
      - uses: actions/checkout@v4

      - name: read pinned skia rev
        id: rev
        shell: bash
        run: echo "rev=$(cat tools/skia-rev.txt)" >> "$GITHUB_OUTPUT"

      - name: restore skia checkout cache
        id: src-cache
        uses: actions/cache@v4
        with:
          # Shared across platforms: exclude the build outputs, which are
          # per-platform (cached separately, keyed by platform).
          path: |
            skia
            !skia/out
          key: skia-src-${{ steps.rev.outputs.rev }}

      - name: sync skia checkout
        if: steps.src-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git depot_tools
          export PATH="$PWD/depot_tools:$PATH"
          git clone https://skia.googlesource.com/skia.git skia
          git -C skia checkout "${{ steps.rev.outputs.rev }}"
          # Same proven flow as the base job: git-sync-deps (not gclient).
          (cd skia && GIT_SYNC_DEPS_SKIP_EMSDK=1 python3 tools/git-sync-deps)
          # Fail loudly if the externals did not land.
          for d in dawn harfbuzz icu; do
            test -d "skia/third_party/externals/$d" || { echo "missing externals/$d after git-sync-deps" >&2; exit 1; }
          done

      - name: restore base build cache
        uses: actions/cache@v4
        with:
          path: skia/out/${{ matrix.out }}
          key: skia-base-${{ matrix.plat }}-${{ steps.rev.outputs.rev }}-v1

      - name: check base cache restored
        shell: bash
        run: test -d "skia/out/${{ matrix.out }}" || { echo "base build cache missed after base job — re-run the workflow" >&2; exit 1; }

      - name: install linux build deps
        if: matrix.plat == 'linux-x64'
        shell: bash
        run: |
          # find_package calls are gated to Linux by F7(a); the Linux
          # configure still needs the dev packages installed.
          sudo apt-get update -qq
          sudo apt-get install -y -qq libfreetype6-dev libfontconfig1-dev libvulkan-dev
          # CMakeLists requires CMake 4.3; ubuntu-24.04 ships 3.28.
          pip3 install --break-system-packages --upgrade cmake
          cmake --version

      - name: build nui_native
        shell: bash
        run: |
          cmake -S native -B build/nui \
            -DSKIA_DIR="$PWD/skia" \
            -DNIELLO_SKIA_OUT="${{ matrix.out }}" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build/nui -j
          # NOTE: SKIA_DIR is the restored checkout (src cache) + built out
          # dir (base cache); both key off the pinned rev.

      - name: merge fat archive (linux)
        if: matrix.plat == 'linux-x64'
        shell: bash
        run: |
          mkdir -p stage/lib
          { echo "CREATE stage/lib/libniello_native.a"
            for a in libskia.a libdawn_combined.a libskcms.a libwuffs.a libskshaper.a libharfbuzz.a; do
              test -f "skia/out/${{ matrix.out }}/$a" || { echo "missing $a" >&2; exit 1; }
              echo "ADDLIB $PWD/skia/out/${{ matrix.out }}/$a"
            done
            echo "ADDLIB $PWD/build/nui/libnui_native.a"
            echo "SAVE"; echo "END"; } > merge.mri
          ar -M < merge.mri   # MRI avoids .o basename collisions (recipe §6)

      - name: merge fat archive (macos)
        if: matrix.plat == 'macos-arm64'
        shell: bash
        run: |
          mkdir -p stage/lib
          libtool -static -o stage/lib/libniello_native.a \
            skia/out/${{ matrix.out }}/libskia.a skia/out/${{ matrix.out }}/libdawn_combined.a \
            skia/out/${{ matrix.out }}/libskcms.a skia/out/${{ matrix.out }}/libwuffs.a \
            skia/out/${{ matrix.out }}/libskshaper.a skia/out/${{ matrix.out }}/libharfbuzz.a \
            build/nui/libnui_native.a

      - name: merge fat archive (windows)
        if: matrix.plat == 'windows-x64'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force stage/lib | Out-Null
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $lib = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools -find '**\lib.exe' | Select-Object -First 1
          & $lib /OUT:stage\lib\niello_native.lib `
            skia\out\${{ matrix.out }}\skia.lib skia\out\${{ matrix.out }}\dawn_combined.lib `
            skia\out\${{ matrix.out }}\skcms.lib skia\out\${{ matrix.out }}\wuffs.lib `
            skia\out\${{ matrix.out }}\skshaper.lib skia\out\${{ matrix.out }}\harfbuzz.lib `
            build\nui\Release\nui_native.lib
          # CRT caveat (recipe §6): LNK2038 on the first real Odin link means
          # the GN runtime-library flag disagrees with the Odin toolchain —
          # align in GN args, verified by hand, not here.

      - name: stage zip
        shell: bash
        run: |
          mkdir -p stage/include
          cp native/nui.h stage/include/
          { echo "platform: ${{ matrix.plat }}"
            echo "skia_rev: $(cat tools/skia-rev.txt)"
            echo "built: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "runner: ${{ matrix.runner }}"; } > stage/BUILD-INFO.txt
          (cd stage && zip -qr "../niello-native-${{ matrix.plat }}.zip" .)

      - name: upload zip
        uses: actions/upload-artifact@v4
        with:
          name: niello-native-${{ matrix.plat }}
          path: niello-native-${{ matrix.plat }}.zip

  # ---- tag push: attach all three zips to the GitHub Release ----
  publish:
    name: publish release
    if: startsWith(github.ref, 'refs/tags/native-v')
    needs: pack
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: niello-native-*
          merge-multiple: true
      - name: create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" niello-native-*.zip \
            --title "${{ github.ref_name }}" \
            --notes "Prebuilt native backends (nui_native + Skia + Dawn + SkShaper + HarfBuzz). See tools/build-native.md for the recipe and provenance."
