# Prebuilt native backends (TODO #11). Builds the Skia+Dawn base per
# platform, compiles nui.cpp against it, merges the fat archive, and
# zips it in the third_party/native layout (see tools/build-native.md).
#
# Two-tier by design (his call 2026-10-22): the Skia+Dawn base is rebuilt
# only when the pinned Skia revision changes (or the gn args change —
# bump the -v1 key suffix then); ordinary releases only compile
# nui.cpp + merge + zip — minutes, not an hour of 10x-billed macos-15 time.
#
# Pin file: tools/skia-rev.txt holds one line — the Skia revision tested
# on his machine (the same rev build-native.sh records into BUILD-INFO.txt).
# Both tiers read it; the caches key off it.
#
# Scope note (2026-11-01): F7(a) — gating the CMake find_package calls
# by platform — is implemented in native/CMakeLists.txt, so all three
# pack jobs configure; the macOS/Windows link sets are the documented
# ones for Dawn + Skia and unproven until the first run. Windows CRT
# alignment stays a manual check (recipe §6) even after this workflow
# is green.
#
# GN args are the build-native.md §2 blocks (F1–F8 ruled 2026-11-01,
# F9 freeze): bundled sourcing (F1b) + DNG/PIEX trim (F4) + the
# HarfBuzz correction from the 2026-11-01 consume test
# (skia_use_system_harfbuzz=false) + skia_use_system_icu=false:
# is_official_build defaults system ICU on, which expects system
# headers no bare runner has; bundled ICU matches F1(b).
# Merge commands from §6; zip layout from §7.

# Linux floor (2026-11-03): the 24.04-built linux-x64 archive cannot
# link on Ubuntu 22.04 (__isoc23_* / _M_replace_cold — glibc 2.38+ /
# GCC 13-era libstdc++). The Linux platform now builds inside an
# ubuntu:22.04 container (base-linux / pack-linux jobs below; the
# linux-x64 matrix entries are gone). sdl3-linux builds the
# bundled SDL3 the same way, as a separate artifact with no
# `needs`. Base cache key is -v2: -v1
# holds 24.04-built objects and must never restore here. Publish
# still needs only `pack` in this phase (dispatch iteration, no
# releases); add pack-linux to `needs` when a tag is cut.

name: native-release

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'native-v*'

jobs:
  # ---- tier 1: build (or restore) the Skia+Dawn base per platform ----
  base:
    name: base (${{ matrix.plat }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - plat: macos-arm64
            runner: macos-15
            out: niello-macos-arm64
            gn_args: >
              is_official_build=true is_debug=false
              skia_enable_graphite=true skia_enable_ganesh=false
              skia_use_dawn=true dawn_enable_metal=true
              dawn_enable_vulkan=false dawn_enable_d3d12=false
              skia_use_webgpu=true skia_use_vma=true
              skia_use_partition_alloc=false
              skia_use_dng_sdk=false skia_use_piex=false
              skia_use_system_expat=false skia_use_system_libjpeg_turbo=false skia_use_system_libpng=false skia_use_system_libwebp=false skia_use_system_zlib=false skia_use_system_harfbuzz=false skia_use_system_icu=false
              target_cpu="arm64"
          - plat: windows-x64
            runner: windows-2022
            out: niello-windows-x64
            gn_args: >
              is_official_build=true is_debug=false
              skia_enable_graphite=true skia_enable_ganesh=false
              skia_use_dawn=true dawn_enable_d3d12=true
              dawn_enable_vulkan=false dawn_enable_metal=false
              skia_use_webgpu=true skia_use_vma=true
              skia_use_partition_alloc=false
              skia_use_dng_sdk=false skia_use_piex=false
              skia_use_system_expat=false skia_use_system_freetype2=false skia_use_system_libjpeg_turbo=false skia_use_system_libpng=false skia_use_system_libwebp=false skia_use_system_zlib=false skia_use_system_harfbuzz=false skia_use_system_icu=false
              target_os="win" target_cpu="x64"
    steps:
      - uses: actions/checkout@v4

      - name: read pinned skia rev
        id: rev
        shell: bash
        run: echo "rev=$(cat tools/skia-rev.txt)" >> "$GITHUB_OUTPUT"

      - name: restore skia checkout cache
        id: src-cache
        uses: actions/cache@v4
        with:
          # Shared across platforms: exclude the build outputs, which are
          # per-platform (cached separately, keyed by platform).
          path: |
            skia
            !skia/out
          key: skia-src-${{ steps.rev.outputs.rev }}

      - name: sync skia checkout
        if: steps.src-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          # depot_tools for ninja + the bundled clang-cl on Windows
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git depot_tools
          export PATH="$PWD/depot_tools:$PATH"
          git clone https://skia.googlesource.com/skia.git skia
          git -C skia checkout "${{ steps.rev.outputs.rev }}"
          # His proven local flow, NOT gclient: git-sync-deps reads DEPS,
          # checks out the externals shallow, and runs bin/fetch-gn, so
          # bin/gn exists for the build step. The gclient path died twice
          # (missing .gclient, then missing bin/gn: DEPS has no hooks).
          # SKIP_EMSDK: desktop builds never use Emscripten; the var is
          # git-sync-deps' own opt-out for its emsdk activation step.
          (cd skia && GIT_SYNC_DEPS_SKIP_EMSDK=1 python3 tools/git-sync-deps)
          # Fail loudly if the externals did not land.
          for d in dawn harfbuzz icu; do
            test -d "skia/third_party/externals/$d" || { echo "missing externals/$d after git-sync-deps" >&2; exit 1; }
          done
          # ninja is downloaded, not checked in (same as bin/gn):
          # depot_tools' `ninja` wrapper needs a bootstrapped checkout
          # ("python3_bin_reldir.txt not found" on a fresh clone), so
          # fetch the DEPS-pinned ninja. fetch-ninja lands it at
          # skia/third_party/ninja/ninja (ninja.exe on Windows) — NOT
          # skia/bin — and the build step calls that path.
          python3 skia/bin/fetch-ninja
          # NOTE: full sync is several GB; this runs only when the pin changes.

      - name: fetch platform build tools
        shell: bash
        run: |
          # The src cache is shared across platforms, but bin/gn and
          # third_party/ninja/ninja are PLATFORM binaries, and
          # fetch-ninja trusts bin/ninja.version: a foreign save looks
          # "up to date" to it, so re-running the fetchers alone would
          # keep the wrong binaries. Delete the stamped tools so both
          # fetchers unconditionally install this runner's binaries.
          # Runs on every job, hit or miss: git-sync-deps covers the
          # miss path, this covers the cache-hit path.
          rm -f skia/bin/gn skia/bin/gn.exe skia/third_party/ninja/ninja skia/third_party/ninja/ninja.exe skia/bin/ninja.version
          python3 skia/bin/fetch-gn
          python3 skia/bin/fetch-ninja

      - name: restore base build cache
        id: base-cache
        uses: actions/cache@v4
        with:
          path: skia/out/${{ matrix.out }}
          # Bump the -v1 suffix when gn_args change: the key pins the Skia rev only.
          key: skia-base-${{ matrix.plat }}-${{ steps.rev.outputs.rev }}-v1

      - name: build skia+dawn base
        if: steps.base-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          export PATH="$PWD/depot_tools:$PATH"
          cd skia
          # Dawn's CMake sub-build finds its ninja via `which ninja`: the
          # depot_tools wrapper on PATH is unbootstrapped on a fresh
          # clone ("python3_bin_reldir.txt not found"), so put the
          # DEPS-pinned real ninja first. depot_tools stays on PATH
          # behind it for the toolchain lookups.
          export PATH="$PWD/third_party/ninja:$PATH"
          bin/gn gen out/${{ matrix.out }} --args='${{ matrix.gn_args }}'
          # `ninja skia` never builds SkShaper: it lives under the
          # `modules` aggregate as its own archive (recipe §3).
          third_party/ninja/ninja -C out/${{ matrix.out }} skia modules/skshaper
          # Windows archives are .lib, not .a (recipe §3).
          if [ "${{ matrix.plat }}" = "windows-x64" ]; then
            test -f "out/${{ matrix.out }}/skshaper.lib" || { echo "skshaper.lib not built (recipe §3)" >&2; exit 1; }
          else
            test -f "out/${{ matrix.out }}/libskshaper.a" || { echo "libskshaper.a not built (recipe §3)" >&2; exit 1; }
          fi

  # ---- tier 1 (jammy): Skia+Dawn base inside ubuntu:22.04 ----
  base-linux:
    name: base (linux-x64)
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:22.04
    steps:
      - uses: actions/checkout@v4

      - name: install container toolchain
        shell: bash
        run: |
          # §2 script, base-job dep set (X11 + fontconfig).
          # Runs as root; no sudo in the container.
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            ca-certificates curl gnupg git python3 python3-pip \
            pkg-config build-essential zip unzip
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            | gpg --dearmor -o /usr/share/keyrings/llvm-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] http://apt.llvm.org/jammy/ llvm-toolchain-jammy-18 main" \
            > /etc/apt/sources.list.d/llvm-toolchain-jammy-18.list
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends clang-18 lld-18
          update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100
          update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-18 100
          clang --version
          # Dawn's CMake sub-build (build_dawn.py, run during the ninja
          # base build) needs `cmake` in PATH — run 5 died on
          # "cmake not found in PATH" at libdawn_combined.a, the same
          # omission class as run 1's SDL failure. Jammy apt cmake is
          # 3.22, below Dawn's 3.30+ floor, so use the same pip route
          # as pack-linux (no --break-system-packages: jammy pip
          # predates PEP 668 and lacks the flag). Do NOT add apt
          # `cmake` here.
          python3 -m pip install --upgrade "cmake>=4.3"
          cmake --version
          apt-get install -y -qq libx11-dev libx11-xcb-dev libfontconfig1-dev

      - name: read pinned skia rev
        id: rev
        shell: bash
        run: echo "rev=$(cat tools/skia-rev.txt)" >> "$GITHUB_OUTPUT"

      - name: restore skia checkout cache
        id: src-cache
        uses: actions/cache@v4
        with:
          path: |
            skia
            !skia/out
          key: skia-src-${{ steps.rev.outputs.rev }}

      - name: sync skia checkout
        if: steps.src-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          # Container-only (runs 113088250776/113092886546):
          # git-sync-deps failed twice with six simultaneous "remote
          # transport reported error" fatals on jammy's older git.
          # Force HTTP/1.1 for the concurrent external clones
          # (HTTP/2 multiplexing suspect). Host jobs keep the proven
          # invocation untouched.
          git config --global http.version HTTP/1.1
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git depot_tools
          export PATH="$PWD/depot_tools:$PATH"
          git clone https://skia.googlesource.com/skia.git skia
          git -C skia checkout "${{ steps.rev.outputs.rev }}"
          # Fallback on failure (container-only; runs 1-4):
          # run 4's serial pass named the first failure (libavif) and
          # killed the concurrency and HTTP/1.1 hypotheses: six DEPS
          # mirrors advertise NO HEAD (libavif, libjxl, oboe,
          # unicodetools, vello, webgpu-headers — exactly the six
          # fatals in every run). `git clone` without --branch asks
          # for HEAD; jammy git 2.34 dies on that, newer git clones
          # empty and recovers via fetch — which is why the proven
          # flow works on host runners and not here. The fallback
          # below never asks for HEAD: init + fetch pinned sha.
          if ! (cd skia && GIT_SYNC_DEPS_SKIP_EMSDK=1 python3 tools/git-sync-deps); then
            echo "git-sync-deps failed; serial fallback over DEPS"
            python3 - <<'PY'
          import os, subprocess
          ns = {}
          exec("def Var(x): return vars[x]\n" + open("skia/DEPS").read(), ns)
          for directory in sorted(ns["deps"]):
              v = ns["deps"][directory]
              if not isinstance(v, str):
                  continue
              repo, sha = v.split("@", 1)
              target = os.path.join("skia", directory)
              print(f"== {directory} {repo} {sha}", flush=True)
              if os.path.isdir(target):
                  toplevel = subprocess.run(
                      ["git", "rev-parse", "--show-toplevel"], cwd=target,
                      capture_output=True, text=True).stdout.strip()
                  ok = (os.path.realpath(toplevel) == os.path.realpath(target)
                        if toplevel else False)
                  if not ok:
                      subprocess.check_call(["rm", "-rf", target])
              if not os.path.isdir(target):
                  subprocess.check_call(["git", "init", "--quiet", target])
                  subprocess.check_call(["git", "-C", target, "remote", "add", "origin", repo])
              else:
                  # Partial checkout left by the failed git-sync-deps
                  # pass: point origin at the DEPS repo (tolerate a
                  # missing origin) before fetching the pinned sha.
                  if subprocess.call(["git", "-C", target, "remote", "set-url", "origin", repo]) != 0:
                      subprocess.check_call(["git", "-C", target, "remote", "add", "origin", repo])
              # Fetch is deliberately NOT --quiet: if this fails, the
              # server's reason is the next diagnosis.
              subprocess.check_call(["git", "-C", target, "fetch", "--depth=1", "origin", sha])
              subprocess.check_call(["git", "-C", target, "checkout", "--quiet", sha])
          print("serial fallback complete", flush=True)
          PY
          fi
          for d in dawn harfbuzz icu; do
            test -d "skia/third_party/externals/$d" || { echo "missing externals/$d after git-sync-deps" >&2; exit 1; }
          done
          python3 skia/bin/fetch-ninja

      - name: fetch platform build tools
        shell: bash
        run: |
          rm -f skia/bin/gn skia/bin/gn.exe skia/third_party/ninja/ninja skia/third_party/ninja/ninja.exe skia/bin/ninja.version
          python3 skia/bin/fetch-gn
          python3 skia/bin/fetch-ninja

      - name: restore base build cache
        id: base-cache
        uses: actions/cache@v4
        with:
          path: skia/out/niello-linux-x64
          key: skia-base-linux-x64-${{ steps.rev.outputs.rev }}-v2

      - name: build skia+dawn base
        if: steps.base-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          export PATH="$PWD/depot_tools:$PATH"
          cd skia
          export PATH="$PWD/third_party/ninja:$PATH"
          bin/gn gen out/niello-linux-x64 --args='is_official_build=true is_debug=false skia_enable_graphite=true skia_enable_ganesh=false skia_use_vulkan=true skia_use_dawn=true dawn_enable_vulkan=true skia_use_webgpu=true skia_use_vma=true skia_use_partition_alloc=false skia_use_dng_sdk=false skia_use_piex=false skia_use_system_expat=false skia_use_system_freetype2=false skia_use_system_libjpeg_turbo=false skia_use_system_libpng=false skia_use_system_libwebp=false skia_use_system_zlib=false skia_use_system_harfbuzz=false skia_use_system_icu=false cc="clang" cxx="clang++"'
          third_party/ninja/ninja -C out/niello-linux-x64 skia modules/skshaper
          test -f "out/niello-linux-x64/libskshaper.a" || { echo "libskshaper.a not built (recipe §3)" >&2; exit 1; }

  # ---- tier 2: compile nui.cpp against the base, merge, zip ----
  pack:
    name: pack (${{ matrix.plat }})
    needs: base
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - plat: macos-arm64
            runner: macos-15
            out: niello-macos-arm64
            lib: lib/libniello_native.a
          - plat: windows-x64
            runner: windows-2022
            out: niello-windows-x64
            lib: lib/niello_native.lib
    steps:
      - uses: actions/checkout@v4

      - name: read pinned skia rev
        id: rev
        shell: bash
        run: echo "rev=$(cat tools/skia-rev.txt)" >> "$GITHUB_OUTPUT"

      - name: restore skia checkout cache
        id: src-cache
        uses: actions/cache@v4
        with:
          # Shared across platforms: exclude the build outputs, which are
          # per-platform (cached separately, keyed by platform).
          path: |
            skia
            !skia/out
          key: skia-src-${{ steps.rev.outputs.rev }}

      - name: sync skia checkout
        if: steps.src-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git depot_tools
          export PATH="$PWD/depot_tools:$PATH"
          git clone https://skia.googlesource.com/skia.git skia
          git -C skia checkout "${{ steps.rev.outputs.rev }}"
          # Same proven flow as the base job: git-sync-deps (not gclient).
          (cd skia && GIT_SYNC_DEPS_SKIP_EMSDK=1 python3 tools/git-sync-deps)
          # Fail loudly if the externals did not land.
          for d in dawn harfbuzz icu; do
            test -d "skia/third_party/externals/$d" || { echo "missing externals/$d after git-sync-deps" >&2; exit 1; }
          done

      - name: restore base build cache
        uses: actions/cache@v4
        with:
          path: skia/out/${{ matrix.out }}
          key: skia-base-${{ matrix.plat }}-${{ steps.rev.outputs.rev }}-v1

      - name: check base cache restored
        shell: bash
        run: test -d "skia/out/${{ matrix.out }}" || { echo "base build cache missed after base job — re-run the workflow" >&2; exit 1; }

      - name: install cmake 4.3 (windows)
        if: matrix.plat == 'windows-x64'
        shell: bash
        run: |
          # CMakeLists requires CMake 4.3; the windows-2022 image ships
          # 3.31.6. Same pip route as the Linux step; the Scripts dir
          # goes on PATH for the later steps via GITHUB_PATH.
          scripts="$(python3 -c "import sysconfig; print(sysconfig.get_path('scripts'))")"
          python3 -m pip install --upgrade "cmake>=4.3"
          export PATH="$scripts:$PATH"
          cmake --version
          echo "$scripts" >> "$GITHUB_PATH"

      - name: build nui_native
        shell: bash
        run: |
          cmake -S native -B build/nui \
            -DSKIA_DIR="$PWD/skia" \
            -DNIELLO_SKIA_OUT="${{ matrix.out }}" \
            -DCMAKE_BUILD_TYPE=Release
          # --config Release: the VS generator is multi-config and
          # defaults to Debug (CMAKE_BUILD_TYPE is ignored there); the
          # merge step expects build/nui/Release/nui_native.lib.
          # Single-config generators ignore --config.
          cmake --build build/nui -j --config Release
          # NOTE: SKIA_DIR is the restored checkout (src cache) + built out
          # dir (base cache); both key off the pinned rev.

      - name: merge fat archive (macos)
        if: matrix.plat == 'macos-arm64'
        shell: bash
        run: |
          mkdir -p stage/lib
          libtool -static -o stage/lib/libniello_native.a \
            skia/out/${{ matrix.out }}/libskia.a skia/out/${{ matrix.out }}/libdawn_combined.a \
            skia/out/${{ matrix.out }}/libskcms.a skia/out/${{ matrix.out }}/libwuffs.a \
            skia/out/${{ matrix.out }}/libskshaper.a skia/out/${{ matrix.out }}/libharfbuzz.a \
            build/nui/libnui_native.a

      - name: merge fat archive (windows)
        if: matrix.plat == 'windows-x64'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force stage/lib | Out-Null
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          # The -requires Microsoft.VisualStudio.Component.VC.Tools
          # query returns nothing on this runner even though CMake
          # finds VS 2022 fine, so don't filter by component: search
          # every VS installation for lib.exe and take the first hit.
          $installPaths = & $vswhere -all -products * -property installationPath
          if (-not $installPaths) { throw "vswhere found no VS installations" }
          Write-Host "VS installations: $installPaths"
          $lib = $null
          foreach ($p in $installPaths) {
            $found = Get-ChildItem "$p\VC\Tools\MSVC" -Recurse -Filter lib.exe -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -match 'Hostx64\\x64' } |
              Select-Object -First 1 -ExpandProperty FullName
            if ($found) { $lib = $found; break }
          }
          if (-not $lib) { throw "lib.exe (Hostx64\x64) not found under any VS installation" }
          # Fail loudly naming any missing input, instead of letting
          # lib.exe report it cryptically (mirrors the Linux merge).
          $inputs = @(
            "skia\out\${{ matrix.out }}\skia.lib",
            "skia\out\${{ matrix.out }}\dawn_combined.lib",
            "skia\out\${{ matrix.out }}\skcms.lib",
            "skia\out\${{ matrix.out }}\wuffs.lib",
            "skia\out\${{ matrix.out }}\skshaper.lib",
            "skia\out\${{ matrix.out }}\harfbuzz.lib",
            "build\nui\Release\nui_native.lib"
          )
          foreach ($in in $inputs) { if (-not (Test-Path $in)) { throw "missing input lib: $in" } }
          & $lib /OUT:stage\lib\niello_native.lib `
            skia\out\${{ matrix.out }}\skia.lib skia\out\${{ matrix.out }}\dawn_combined.lib `
            skia\out\${{ matrix.out }}\skcms.lib skia\out\${{ matrix.out }}\wuffs.lib `
            skia\out\${{ matrix.out }}\skshaper.lib skia\out\${{ matrix.out }}\harfbuzz.lib `
            build\nui\Release\nui_native.lib
          # CRT caveat (recipe §6): LNK2038 on the first real Odin link means
          # the GN runtime-library flag disagrees with the Odin toolchain —
          # align in GN args, verified by hand, not here.

      - name: stage zip
        shell: bash
        run: |
          mkdir -p stage/include
          cp native/nui.h stage/include/
          { echo "platform: ${{ matrix.plat }}"
            echo "skia_rev: $(cat tools/skia-rev.txt)"
            echo "built: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "runner: ${{ matrix.runner }}"; } > stage/BUILD-INFO.txt
          # No `zip` binary on the windows-2022 runner (Git Bash), and
          # python3 is already a hard dependency of the sync/fetch
          # steps, so build the archive with the stdlib zipfile module
          # on all three platforms: one code path, same layout.
          python3 - <<'PY'
          import os, zipfile
          out = "niello-native-${{ matrix.plat }}.zip"
          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as z:
              for root, dirs, files in os.walk("stage"):
                  for f in sorted(files):
                      p = os.path.join(root, f)
                      z.write(p, os.path.relpath(p, "stage").replace(os.sep, "/"))
          PY

      - name: upload zip
        uses: actions/upload-artifact@v4
        with:
          name: niello-native-${{ matrix.plat }}
          path: niello-native-${{ matrix.plat }}.zip

  # ---- tier 2 (jammy): nui.cpp + merge + zip ----
  pack-linux:
    name: pack (linux-x64)
    needs: base-linux
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:22.04
    steps:
      - uses: actions/checkout@v4

      - name: install container toolchain
        shell: bash
        run: |
          # §2 script, pack-job dep set (freetype + fontconfig + Vulkan)
          # plus CMake 4.3 via pip (no --break-system-packages on jammy).
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            ca-certificates curl gnupg git python3 python3-pip \
            pkg-config build-essential zip unzip
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            | gpg --dearmor -o /usr/share/keyrings/llvm-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] http://apt.llvm.org/jammy/ llvm-toolchain-jammy-18 main" \
            > /etc/apt/sources.list.d/llvm-toolchain-jammy-18.list
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends clang-18 lld-18
          update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100
          update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-18 100
          apt-get install -y -qq libfreetype6-dev libfontconfig1-dev libvulkan-dev
          python3 -m pip install --upgrade "cmake>=4.3"
          cmake --version

      - name: read pinned skia rev
        id: rev
        shell: bash
        run: echo "rev=$(cat tools/skia-rev.txt)" >> "$GITHUB_OUTPUT"

      - name: restore skia checkout cache
        id: src-cache
        uses: actions/cache@v4
        with:
          path: |
            skia
            !skia/out
          key: skia-src-${{ steps.rev.outputs.rev }}

      - name: sync skia checkout
        if: steps.src-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          # Container-only (runs 113088250776/113092886546):
          # git-sync-deps failed twice with six simultaneous "remote
          # transport reported error" fatals on jammy's older git.
          # Force HTTP/1.1 for the concurrent external clones
          # (HTTP/2 multiplexing suspect). Host jobs keep the proven
          # invocation untouched.
          git config --global http.version HTTP/1.1
          git clone --depth 1 https://chromium.googlesource.com/chromium/tools/depot_tools.git depot_tools
          export PATH="$PWD/depot_tools:$PATH"
          git clone https://skia.googlesource.com/skia.git skia
          git -C skia checkout "${{ steps.rev.outputs.rev }}"
          # Fallback on failure (container-only; runs 1-4):
          # run 4's serial pass named the first failure (libavif) and
          # killed the concurrency and HTTP/1.1 hypotheses: six DEPS
          # mirrors advertise NO HEAD (libavif, libjxl, oboe,
          # unicodetools, vello, webgpu-headers — exactly the six
          # fatals in every run). `git clone` without --branch asks
          # for HEAD; jammy git 2.34 dies on that, newer git clones
          # empty and recovers via fetch — which is why the proven
          # flow works on host runners and not here. The fallback
          # below never asks for HEAD: init + fetch pinned sha.
          if ! (cd skia && GIT_SYNC_DEPS_SKIP_EMSDK=1 python3 tools/git-sync-deps); then
            echo "git-sync-deps failed; serial fallback over DEPS"
            python3 - <<'PY'
          import os, subprocess
          ns = {}
          exec("def Var(x): return vars[x]\n" + open("skia/DEPS").read(), ns)
          for directory in sorted(ns["deps"]):
              v = ns["deps"][directory]
              if not isinstance(v, str):
                  continue
              repo, sha = v.split("@", 1)
              target = os.path.join("skia", directory)
              print(f"== {directory} {repo} {sha}", flush=True)
              if os.path.isdir(target):
                  toplevel = subprocess.run(
                      ["git", "rev-parse", "--show-toplevel"], cwd=target,
                      capture_output=True, text=True).stdout.strip()
                  ok = (os.path.realpath(toplevel) == os.path.realpath(target)
                        if toplevel else False)
                  if not ok:
                      subprocess.check_call(["rm", "-rf", target])
              if not os.path.isdir(target):
                  subprocess.check_call(["git", "init", "--quiet", target])
                  subprocess.check_call(["git", "-C", target, "remote", "add", "origin", repo])
              else:
                  # Partial checkout left by the failed git-sync-deps
                  # pass: point origin at the DEPS repo (tolerate a
                  # missing origin) before fetching the pinned sha.
                  if subprocess.call(["git", "-C", target, "remote", "set-url", "origin", repo]) != 0:
                      subprocess.check_call(["git", "-C", target, "remote", "add", "origin", repo])
              # Fetch is deliberately NOT --quiet: if this fails, the
              # server's reason is the next diagnosis.
              subprocess.check_call(["git", "-C", target, "fetch", "--depth=1", "origin", sha])
              subprocess.check_call(["git", "-C", target, "checkout", "--quiet", sha])
          print("serial fallback complete", flush=True)
          PY
          fi
          for d in dawn harfbuzz icu; do
            test -d "skia/third_party/externals/$d" || { echo "missing externals/$d after git-sync-deps" >&2; exit 1; }
          done

      - name: restore base build cache
        uses: actions/cache@v4
        with:
          path: skia/out/niello-linux-x64
          key: skia-base-linux-x64-${{ steps.rev.outputs.rev }}-v2

      - name: check base cache restored
        shell: bash
        run: test -d "skia/out/niello-linux-x64" || { echo "base build cache missed after base-linux — re-run the workflow" >&2; exit 1; }

      - name: build nui_native
        shell: bash
        run: |
          export CC=clang CXX=clang++
          cmake -S native -B build/nui \
            -DSKIA_DIR="$PWD/skia" \
            -DNIELLO_SKIA_OUT="niello-linux-x64" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build build/nui -j --config Release

      - name: merge fat archive (linux)
        shell: bash
        run: |
          mkdir -p stage/lib
          { echo "CREATE stage/lib/libniello_native.a"
            for a in libskia.a libdawn_combined.a libskcms.a libwuffs.a libskshaper.a libharfbuzz.a; do
              test -f "skia/out/niello-linux-x64/$a" || { echo "missing $a" >&2; exit 1; }
              echo "ADDLIB $PWD/skia/out/niello-linux-x64/$a"
            done
            echo "ADDLIB $PWD/build/nui/libnui_native.a"
            echo "SAVE"; echo "END"; } > merge.mri
          ar -M < merge.mri

      - name: stage zip
        shell: bash
        run: |
          mkdir -p stage/include
          cp native/nui.h stage/include/
          { echo "platform: linux-x64"
            echo "skia_rev: $(cat tools/skia-rev.txt)"
            echo "built: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "runner: ubuntu:22.04 container on ubuntu-24.04"; } > stage/BUILD-INFO.txt
          python3 - <<'PY'
          import os, zipfile
          out = "niello-native-linux-x64.zip"
          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as z:
              for root, dirs, files in os.walk("stage"):
                  for f in sorted(files):
                      p = os.path.join(root, f)
                      z.write(p, os.path.relpath(p, "stage").replace(os.sep, "/"))
          PY

      - name: upload zip
        uses: actions/upload-artifact@v4
        with:
          name: niello-native-linux-x64
          path: niello-native-linux-x64.zip

  # ---- sdl3 (linux): shared libSDL3.so.0 inside ubuntu:22.04 ----
  # Independent job: no `needs`. It shares nothing with base-linux /
  # pack-linux, so an SDL failure never blocks the native archive
  # proof and vice versa. Same container, same pin discipline:
  # SDL release-3.4.12 (F1(a)); floor enforced in the check step
  # (F4). Separate artifact; F3 fetch/artifact-separation is later.
  sdl3-linux:
    name: sdl3 (linux-x64)
    runs-on: ubuntu-24.04
    container:
      image: ubuntu:22.04
    steps:
      - uses: actions/checkout@v4

      - name: install container toolchain
        shell: bash
        run: |
          # Same clang-18 setup as base-linux/pack-linux (jammy draft
          # §2). Runs as root; no sudo in the container.
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            ca-certificates curl gnupg git python3 python3-pip \
            pkg-config build-essential zip unzip cmake
          curl -fsSL https://apt.llvm.org/llvm-snapshot.gpg.key \
            | gpg --dearmor -o /usr/share/keyrings/llvm-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/llvm-archive-keyring.gpg] http://apt.llvm.org/jammy/ llvm-toolchain-jammy-18 main" \
            > /etc/apt/sources.list.d/llvm-toolchain-jammy-18.list
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends clang-18 lld-18
          update-alternatives --install /usr/bin/clang clang /usr/bin/clang-18 100
          update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-18 100
          clang --version

      - name: install SDL build deps
        shell: bash
        run: |
          # SDL's own Ubuntu 22.04+ list (SDL wiki README-linux), all
          # features enabled, plus libvulkan-dev for the Vulkan video
          # backend. A missing -dev package does NOT fail the build —
          # SDL silently disables that backend — so the Wayland check
          # below is the gate that proves this list was complete.
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            libasound2-dev libpulse-dev libaudio-dev libfribidi-dev \
            libjack-dev libsndio-dev libsamplerate0-dev \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxfixes-dev libxi-dev libxss-dev libxtst-dev \
            libxkbcommon-dev libdrm-dev libgbm-dev \
            libgl1-mesa-dev libgles2-mesa-dev libegl1-mesa-dev \
            libdbus-1-dev libibus-1.0-dev libudev-dev libthai-dev \
            libusb-1.0-0-dev \
            libpipewire-0.3-dev libwayland-dev wayland-protocols \
            libdecor-0-dev liburing-dev libvulkan-dev

      - name: clone SDL 3.4.12
        shell: bash
        run: |
          git clone --depth 1 --branch release-3.4.12 \
            https://github.com/libsdl-org/SDL.git sdl
          # Fail loudly if the checkout is not exactly the pinned tag.
          test "$(git -C sdl describe --tags --exact-match)" = "release-3.4.12" || { echo "SDL checkout is not release-3.4.12" >&2; exit 1; }
          git -C sdl rev-parse HEAD

      - name: build SDL3
        shell: bash
        run: |
          export CC=clang CXX=clang++
          # CMAKE_INSTALL_LIBDIR=lib pins the install layout (no
          # Debian multiarch subdir), so the check step's paths hold.
          cmake -S sdl -B build/sdl \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/sdl-prefix" \
            -DCMAKE_INSTALL_LIBDIR=lib \
            -DSDL_SHARED=ON -DSDL_STATIC=OFF \
            -DSDL_TESTS=OFF -DSDL_EXAMPLES=OFF 2>&1 | tee sdl-configure.log
          cmake --build build/sdl -j
          cmake --install build/sdl
          ls -la sdl-prefix/lib/libSDL3.so*

      - name: check SDL3 floor, SONAME, version, and Wayland backend
        shell: bash
        run: |
          LIB="sdl-prefix/lib/libSDL3.so.0"
          # SONAME must be exactly libSDL3.so.0 — never rename to paper
          # over a mismatch (the Mint .so.1/.so.0 lesson).
          readelf -d "$LIB" | grep -q "SONAME.*\[libSDL3\.so\.0\]" || { echo "SONAME is not libSDL3.so.0" >&2; exit 1; }
          # Installed version must be the pinned one.
          test "$(PKG_CONFIG_PATH="$PWD/sdl-prefix/lib/pkgconfig" pkg-config --modversion sdl3)" = "3.4.12" || { echo "sdl3 pkg-config version is not 3.4.12" >&2; exit 1; }
          # Wayland backend gate: SDL dlopens Wayland at run time, so
          # ldd cannot prove the backend was built. Gate on SDL's own
          # configure summary, captured by the build step: it lists
          # the video drivers it enabled. (A `strings` probe for
          # xdg-shell names was tried first and proved unreliable —
          # run 113092886546 had Wayland ON in the summary with the
          # protocol objects compiled, yet the probe found nothing.)
          grep -q "wayland(dynamic)" sdl-configure.log || { echo "Wayland backend not enabled in SDL configure summary" >&2; exit 1; }
          # F4 enforcement: fail if the floor rises above glibc 2.35 /
          # the GCC 11 libstdc++ era on the shipped library.
          python3 - "$LIB" <<'PY'
          import re, subprocess, sys
          lib = sys.argv[1]
          out = subprocess.check_output(["readelf", "--version-info", lib], text=True)
          bad = []
          for major, minor in set(re.findall(r"\bGLIBC_(\d+)\.(\d+)", out)):
              if (int(major), int(minor)) > (2, 35):
                  bad.append(f"GLIBC_{major}.{minor}")
          for patch in set(re.findall(r"\bGLIBCXX_3\.4\.(\d+)", out)):
              if int(patch) > 29:
                  bad.append(f"GLIBCXX_3.4.{patch}")
          if bad:
              print("floor violation on", lib, ":", ", ".join(sorted(bad)), file=sys.stderr)
              sys.exit(1)
          print("floor OK:", lib)
          PY
          # ldd baseline, for the record (M0/D8 set).
          ldd "$LIB" || true

      - name: stage zip
        shell: bash
        run: |
          mkdir -p stage/lib
          # cp -L: follow the install symlinks so the zip holds the real
          # library as libSDL3.so.0. The link-time libSDL3.so symlink
          # is created by the fetch script (F3 work), not shipped.
          cp -L sdl-prefix/lib/libSDL3.so.0 stage/lib/
          cp sdl/LICENSE.txt stage/
          { echo "platform: linux-x64"
            echo "sdl_tag: release-3.4.12"
            echo "built: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "runner: ubuntu:22.04 container on ubuntu-24.04"; } > stage/BUILD-INFO.txt
          python3 - <<'PY'
          import os, zipfile
          out = "niello-sdl3-linux-x64.zip"
          with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as z:
              for root, dirs, files in os.walk("stage"):
                  for f in sorted(files):
                      p = os.path.join(root, f)
                      z.write(p, os.path.relpath(p, "stage").replace(os.sep, "/"))
          PY

      - name: upload zip
        uses: actions/upload-artifact@v4
        with:
          name: niello-sdl3-linux-x64
          path: niello-sdl3-linux-x64.zip

  # ---- tag push: attach all three zips to the GitHub Release ----
  publish:
    name: publish release
    if: startsWith(github.ref, 'refs/tags/native-v')
    needs: pack
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # gh resolves the repository from the git checkout; without
      # this step the workspace has no .git and `gh release create`
      # dies with "not a git repository" (2026-11-02 tag run).
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: niello-native-*
          merge-multiple: true
      - name: create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${{ github.ref_name }}" niello-native-*.zip \
            --title "${{ github.ref_name }}" \
            --notes "Prebuilt native backends (nui_native + Skia + Dawn + SkShaper + HarfBuzz). See tools/build-native.md for the recipe and provenance."
