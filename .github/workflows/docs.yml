# User documentation: build the mdBook in docs/ and publish it to GitHub
# Pages. Pull requests build only, so broken docs are caught before merge.
#
# Every code example in the book comes from docs/snippets: the window
# programs (docs/snippets/apps/*) are compile-checked and the headless
# snippets (docs/snippets/headless) run as tests, before the book builds.
# No native backend is needed for either.
#
# One-time setup: repository Settings -> Pages -> Source: "GitHub Actions".
name: docs

on:
  push:
    branches: [main]
    paths: ["docs/**", "niello/**", "tools/mdbook-version.txt", "tools/odin-version.txt", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", "niello/**", "tools/mdbook-version.txt", "tools/odin-version.txt", ".github/workflows/docs.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Odin
        run: |
          ODIN_VERSION="$(cat tools/odin-version.txt)"
          mkdir -p "$RUNNER_TEMP/odin"
          curl -sSfL "https://github.com/odin-lang/Odin/releases/download/${ODIN_VERSION}/odin-linux-amd64-${ODIN_VERSION}.tar.gz" \
            | tar -xz --strip-components=1 -C "$RUNNER_TEMP/odin"
          echo "$RUNNER_TEMP/odin" >> "$GITHUB_PATH"

      - name: Install mdBook
        run: |
          MDBOOK_VERSION="$(cat tools/mdbook-version.txt)"
          mkdir -p "$RUNNER_TEMP/mdbook"
          curl -sSfL "https://github.com/rust-lang/mdBook/releases/download/v${MDBOOK_VERSION}/mdbook-v${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz" \
            | tar -xz -C "$RUNNER_TEMP/mdbook"
          echo "$RUNNER_TEMP/mdbook" >> "$GITHUB_PATH"

      - name: Check the window snippets
        run: |
          odin version
          for d in docs/snippets/apps/*/; do
            echo "odin check $d"
            odin check "$d" -collection:niello=niello
          done

      - name: Run the headless snippets
        run: odin test docs/snippets/headless -define:ODIN_TEST_THREADS=1 -collection:niello=niello

      - name: Build the book
        run: mdbook build docs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/book

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
