[book]
title = "NielloUI"
description = "A cross-platform desktop UI framework in Odin: retained styling, immediate-mode declaration, Skia Graphite behind SDL3."
authors = ["Odalith"]
language = "en"
src = "src"

[build]
build-dir = "book"
# Every page in SUMMARY.md must exist: the API reference pages come from
# tools/docgen, and a missing one fails the build instead of turning into an
# empty page.
create-missing = false

[output.html]
default-theme = "light"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/Odalith/NielloUI"
edit-url-template = "https://github.com/Odalith/NielloUI/edit/main/docs/{path}"
site-url = "/NielloUI/"
additional-js = ["theme/odin-highlight.js"]
additional-css = ["theme/docgen.css"]

[output.html.search]
enable = true
